<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#grad1)" rx="15" ry="15" />
  <text x="50%" y="45%" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" dominant-baseline="middle" text-anchor="middle">
    🚀 Awesome Sales Call Coaching 🚀
  </text>
  <text x="50%" y="70%" font-family="Arial, sans-serif" font-size="24" fill="white" dominant-baseline="middle" text-anchor="middle">
    AI-Powered Role-Play &amp; Conversation Intelligence
  </text>
  <circle cx="100" cy="100" r="20" fill="white" opacity="0.3">
    <animate attributeName="r" values="20;40;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="100" r="20" fill="white" opacity="0.3">
    <animate attributeName="r" values="20;40;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
